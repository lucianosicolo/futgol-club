<main class="home-container">


  <!-- ======================= -->
  <!-- BIENVENIDA              -->
  <!-- ======================= -->

  <section class="welcome-section">

    <p
      class="welcome-label"
      *ngIf="isAdmin"
    >
      Panel de administración
    </p>

    <p
      class="welcome-label"
      *ngIf="isTeacher"
    >
      Panel del profesor
    </p>


    <h1>
      ¡Hola, {{ user?.name }}!
    </h1>


    <p *ngIf="isAdmin">
      Este es el resumen general de FUTGOL CLUB.
    </p>

    <p *ngIf="isTeacher">
      Acá tenés el resumen de alumnos y asistencia.
    </p>

  </section>


  <!-- ======================= -->
  <!-- CARGANDO                -->
  <!-- ======================= -->

  <div
    class="home-loading"
    *ngIf="loading"
  >

    <ion-spinner
      name="crescent"
    ></ion-spinner>

    <span>
      Cargando información...
    </span>

  </div>


  <!-- ======================= -->
  <!-- ESTADÍSTICAS            -->
  <!-- ======================= -->

  <section
    class="stats-grid"
    *ngIf="!loading"
  >


    <!-- ======================= -->
    <!-- ALUMNOS                 -->
    <!-- ADMIN + PROFE           -->
    <!-- ======================= -->

    <button
      type="button"
      class="stat-card"
      routerLink="/app/alumnos"
    >

      <div class="stat-header">

        <div class="stat-icon icon-dark-bg">

          <ion-icon
            name="people-outline"
          ></ion-icon>

        </div>

        <span>
          ALUMNOS
        </span>

      </div>


      <strong>
        {{ totalStudents }}
      </strong>

      <small>
        Ver todos los alumnos
      </small>

    </button>


    <!-- ======================= -->
    <!-- ADMIN - AL DÍA          -->
    <!-- ======================= -->

    <button
      *ngIf="isAdmin"
      type="button"
      class="stat-card"
      routerLink="/app/pagos"
      [queryParams]="{
        filter: 'paid'
      }"
    >

      <div class="stat-header">

        <div class="stat-icon icon-green-bg">

          <ion-icon
            name="checkmark-circle-outline"
          ></ion-icon>

        </div>

        <span>
          AL DÍA
        </span>

      </div>


      <strong>
        {{ paidStudents }}
      </strong>

      <small class="positive">
        {{ paidPercentage }}% del período
      </small>

    </button>


    <!-- ======================= -->
    <!-- ADMIN - DEBEN           -->
    <!-- ======================= -->

    <button
      *ngIf="isAdmin"
      type="button"
      class="stat-card"
      routerLink="/app/pagos"
      [queryParams]="{
        filter: 'due'
      }"
    >

      <div class="stat-header">

        <div class="stat-icon icon-red-bg">

          <ion-icon
            name="alert-circle-outline"
          ></ion-icon>

        </div>

        <span>
          DEBEN
        </span>

      </div>


      <strong>
        {{ dueStudents }}
      </strong>

      <small class="negative">
        {{ duePercentage }}% del período
      </small>

    </button>


    <!-- ======================= -->
    <!-- ADMIN - RECAUDACIÓN     -->
    <!-- ======================= -->

    <button
      *ngIf="isAdmin"
      type="button"
      class="stat-card revenue-card"
      routerLink="/app/pagos"
    >

      <div class="stat-header">

        <div class="stat-icon icon-green-bg">

          <ion-icon
            name="cash-outline"
          ></ion-icon>

        </div>

        <span>
          RECAUDACIÓN DEL MES
        </span>

      </div>


      <strong class="revenue-value">

        {{
          monthlyRevenue
            | currency:
              'ARS':
              'symbol':
              '1.0-0':
              'es-AR'
        }}

      </strong>


      <small>
        Ver detalle de pagos
      </small>

    </button>


    <!-- ======================= -->
    <!-- PROFE - PRESENTES       -->
    <!-- ======================= -->

    <button
      *ngIf="isTeacher"
      type="button"
      class="stat-card"
      routerLink="/app/asistencia"
    >

      <div class="stat-header">

        <div class="stat-icon icon-green-bg">

          <ion-icon
            name="checkmark-circle-outline"
          ></ion-icon>

        </div>

        <span>
          PRESENTES HOY
        </span>

      </div>


      <strong>
        {{ presentStudents }}
      </strong>

      <small class="positive">
        {{ porcentajePresentes }}% registrados
      </small>

    </button>


    <!-- ======================= -->
    <!-- PROFE - AUSENTES        -->
    <!-- ======================= -->

    <button
      *ngIf="isTeacher"
      type="button"
      class="stat-card"
      routerLink="/app/asistencia"
    >

      <div class="stat-header">

        <div class="stat-icon icon-red-bg">

          <ion-icon
            name="close-circle-outline"
          ></ion-icon>

        </div>

        <span>
          AUSENTES HOY
        </span>

      </div>


      <strong>
        {{ absentStudents }}
      </strong>

      <small class="negative">
        {{ porcentajeAusentes }}% registrados
      </small>

    </button>


    <!-- ======================= -->
    <!-- PROFE - CALENDARIO      -->
    <!-- ======================= -->

    <button
      *ngIf="isTeacher"
      type="button"
      class="stat-card"
      routerLink="/app/calendario"
    >

      <div class="stat-header">

        <div class="stat-icon icon-dark-bg">

          <ion-icon
            name="calendar-outline"
          ></ion-icon>

        </div>

        <span>
          CALENDARIO
        </span>

      </div>


      <strong>
        Agenda
      </strong>

      <small>
        Ver próximas actividades
      </small>

    </button>

  </section>


  <!-- ======================= -->
  <!-- AGENDA                  -->
  <!-- ======================= -->

  <ion-card class="activity-card">

    <ion-card-content>


      <div class="section-heading">

        <div>

          <span class="section-label">
            AGENDA
          </span>

          <h2>
            Calendario del club
          </h2>

        </div>


        <button
          type="button"
          class="text-button"
          routerLink="/app/calendario"
        >
          Ver calendario
        </button>

      </div>


      <div class="activity-information">

        <div class="activity-time">

          <ion-icon
            name="calendar-outline"
          ></ion-icon>

        </div>


        <div class="activity-name">

          <strong>
            Próximas actividades
          </strong>

          <small>
            Consultá entrenamientos y eventos del club.
          </small>

        </div>


        <ion-icon
          name="chevron-forward-outline"
        ></ion-icon>

      </div>

    </ion-card-content>

  </ion-card>


</main>
