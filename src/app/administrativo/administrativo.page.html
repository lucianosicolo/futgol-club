<ion-content
  class="administrative-content"
>

  <div
    class="administrative-container"
  >

    <!-- ======================= -->
    <!-- ENCABEZADO              -->
    <!-- ======================= -->

    <section
      class="page-header"
    >

      <div
        class="header-icon"
      >
        <ion-icon
          name="briefcase-outline"
        ></ion-icon>
      </div>


      <div>
        <span
          class="eyebrow"
        >
          FUTGOL CLUB
        </span>

        <h1>
          Administrativo
        </h1>

        <p>
          Cuotas, cobros y configuración
          administrativa del club.
        </p>
      </div>

    </section>


    <!-- ======================= -->
    <!-- OPCIONES                -->
    <!-- ======================= -->

    <section
      class="administrative-options"
    >


      <!-- GESTIÓN DE CUOTAS -->

      <button
        type="button"
        class="administrative-card"
        routerLink="/app/gestion-cuotas"
      >

        <div
          class="card-icon green"
        >

          <ion-icon
            name="settings-outline"
          ></ion-icon>

        </div>


        <div
          class="card-information"
        >

          <strong>
            Gestión de cuotas
          </strong>

          <span>
            Configurá aranceles,
            vencimientos y generá
            las cuotas de cada mes.
          </span>

        </div>


        <ion-icon
          class="card-arrow"
          name="chevron-forward-outline"
        ></ion-icon>

      </button>


      <!-- PAGOS -->

      <button
        type="button"
        class="administrative-card"
        routerLink="/app/pagos"
      >

        <div
          class="card-icon blue"
        >

          <ion-icon
            name="wallet-outline"
          ></ion-icon>

        </div>


        <div
          class="card-information"
        >

          <strong>
            Pagos
          </strong>

          <span>
            Consultá quién debe,
            registrá cobros y gestioná
            los pagos realizados.
          </span>

        </div>


        <ion-icon
          class="card-arrow"
          name="chevron-forward-outline"
        ></ion-icon>

      </button>


      <!-- REPORTES -->

      <button
        type="button"
        class="
          administrative-card
          disabled-card
        "
        disabled
      >

        <div
          class="card-icon orange"
        >

          <ion-icon
            name="bar-chart-outline"
          ></ion-icon>

        </div>


        <div
          class="card-information"
        >

          <div
            class="card-title-row"
          >

            <strong>
              Reportes
            </strong>

            <span
              class="coming-soon"
            >
              Próximamente
            </span>

          </div>

          <span>
            Ingresos, deuda,
            recaudación y estadísticas.
          </span>

        </div>

      </button>


    </section>

  </div>

</ion-content>
