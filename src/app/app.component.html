<ion-app>

  <ion-menu
    contentId="main-content"
    type="overlay"
    class="main-menu"
  >

    <ion-header class="ion-no-border">
      <ion-toolbar class="menu-header">
        <div class="menu-brand">
          <div class="brand-icon">
            <ion-icon name="football-outline"></ion-icon>
          </div>

          <div>
            <strong>FUTGOL <span>CLUB</span></strong>
            <small>Panel de administración</small>
          </div>
        </div>
      </ion-toolbar>
    </ion-header>

    <ion-content class="menu-content">

      <div class="menu-user">
        <div class="user-avatar">
          <ion-icon name="person-outline"></ion-icon>
        </div>

        <div class="user-information">
          <strong>Profe Bruno</strong>
          <span>Administrador</span>
        </div>
      </div>

      <div class="menu-section-title">
        NAVEGACIÓN
      </div>

      <ion-list lines="none" class="menu-list">

        <ion-menu-toggle auto-hide="false">
          <ion-item
            routerLink="/app/home"
            routerDirection="root"
            routerLinkActive="selected"
            [routerLinkActiveOptions]="{ exact: true }"
            detail="false"
          >
            <div slot="start" class="menu-item-icon">
              <ion-icon name="home-outline"></ion-icon>
            </div>

            <ion-label>Inicio</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="false">
          <ion-item
            routerLink="/app/asistencia"
            routerDirection="root"
            routerLinkActive="selected"
            detail="false"
          >
            <div slot="start" class="menu-item-icon">
              <ion-icon name="checkmark-circle-outline"></ion-icon>
            </div>

            <ion-label>Asistencia</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="false">
          <ion-item
            routerLink="/app/pagos"
            routerDirection="root"
            routerLinkActive="selected"
            detail="false"
          >
            <div slot="start" class="menu-item-icon">
              <ion-icon name="wallet-outline"></ion-icon>
            </div>

            <ion-label>Pagos</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="false">
          <ion-item
            routerLink="/app/perfil"
            routerDirection="root"
            routerLinkActive="selected"
            detail="false"
          >
            <div slot="start" class="menu-item-icon">
              <ion-icon name="person-outline"></ion-icon>
            </div>

            <ion-label>Perfil</ion-label>
          </ion-item>
        </ion-menu-toggle>

      </ion-list>

      <div class="menu-section-title secondary-title">
        PRÓXIMAMENTE
      </div>

      <ion-list lines="none" class="menu-list future-list">

        <ion-item detail="false" disabled>
          <div slot="start" class="menu-item-icon">
            <ion-icon name="people-outline"></ion-icon>
          </div>

          <ion-label>Alumnos</ion-label>

          <ion-badge slot="end">
            Próximamente
          </ion-badge>
        </ion-item>

        <ion-item detail="false" disabled>
          <div slot="start" class="menu-item-icon">
            <ion-icon name="bar-chart-outline"></ion-icon>
          </div>

          <ion-label>Reportes</ion-label>
        </ion-item>

        <ion-item detail="false" disabled>
          <div slot="start" class="menu-item-icon">
            <ion-icon name="calendar-outline"></ion-icon>
          </div>

          <ion-label>Calendario</ion-label>
        </ion-item>

        <ion-item detail="false" disabled>
          <div slot="start" class="menu-item-icon">
            <ion-icon name="settings-outline"></ion-icon>
          </div>

          <ion-label>Configuración</ion-label>
        </ion-item>

      </ion-list>

    </ion-content>

    <ion-footer class="ion-no-border menu-footer">
      <ion-toolbar>
       <ion-button
  expand="block"
  fill="clear"
  class="logout-button"
  (click)="logout()"
>
  <ion-icon
    slot="start"
    name="log-out-outline"
  ></ion-icon>

  Cerrar sesión
</ion-button>
      </ion-toolbar>
    </ion-footer>

  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-app>
