<ion-app>

  <ion-menu
    contentId="main-content"
    type="overlay"
    class="main-menu"
  >

    <!-- ======================= -->
    <!-- HEADER                  -->
    <!-- ======================= -->

    <ion-header class="ion-no-border">

      <ion-toolbar class="menu-header">

        <div class="menu-brand">

          <div class="brand-icon">

            <img
              src="assets/icon/logo.png"
              alt="FUTGOL Club"
              class="brand-logo"
            />

          </div>


          <div>

            <strong>
              FUTGOL
              <span>
                CLUB
              </span>
            </strong>

            <small *ngIf="isAdmin">
              Panel de administración
            </small>

            <small *ngIf="isTeacher">
              Panel del profesor
            </small>

            <small *ngIf="isResponsible">
              Mi FUTGOL
            </small>

          </div>

        </div>

      </ion-toolbar>

    </ion-header>


    <!-- ======================= -->
    <!-- CONTENIDO               -->
    <!-- ======================= -->

    <ion-content class="menu-content">


      <!-- USUARIO -->

      <div class="menu-user">

        <div class="user-avatar">

          <ion-icon
            name="person-outline"
          ></ion-icon>

        </div>


        <div class="user-information">

          <strong>
            {{ user?.name }}
            {{ user?.last_name }}
          </strong>

          <span>
            {{ roleLabel }}
          </span>

        </div>

      </div>


      <div class="menu-section-title">
        NAVEGACIÓN
      </div>


      <!-- ======================= -->
      <!-- ADMIN                   -->
      <!-- ======================= -->

      <ion-list
        *ngIf="isAdmin"
        lines="none"
        class="menu-list"
      >


        <!-- INICIO -->

        <ion-menu-toggle
          auto-hide="false"
        >

          <ion-item
            routerLink="/app/home"
            routerDirection="root"
            routerLinkActive="selected"
            [routerLinkActiveOptions]="{
              exact: true
            }"
            detail="false"
          >

            <div
              slot="start"
              class="menu-item-icon"
            >

              <ion-icon
                name="home-outline"
              ></ion-icon>

            </div>

            <ion-label>
              Inicio
            </ion-label>

          </ion-item>

        </ion-menu-toggle>


        <!-- ALUMNOS -->

        <ion-menu-toggle
          auto-hide="false"
        >

          <ion-item
            routerLink="/app/alumnos"
            routerDirection="root"
            routerLinkActive="selected"
            detail="false"
          >

            <div
              slot="start"
              class="menu-item-icon"
            >

              <ion-icon
                name="people-outline"
              ></ion-icon>

            </div>

            <ion-label>
              Alumnos
            </ion-label>

          </ion-item>

        </ion-menu-toggle>


        <!-- ASISTENCIA -->

        <ion-menu-toggle
          auto-hide="false"
        >

          <ion-item
            routerLink="/app/asistencia"
            routerDirection="root"
            routerLinkActive="selected"
            detail="false"
          >

            <div
              slot="start"
              class="menu-item-icon"
            >

              <ion-icon
                name="checkmark-circle-outline"
              ></ion-icon>

            </div>

            <ion-label>
              Asistencia
            </ion-label>

          </ion-item>

        </ion-menu-toggle>


        <!-- ADMINISTRATIVO -->

        <ion-menu-toggle
          auto-hide="false"
        >

          <ion-item
            routerLink="/app/administrativo"
            routerDirection="root"
            routerLinkActive="selected"
            detail="false"
          >

            <div
              slot="start"
              class="menu-item-icon"
            >

              <ion-icon
                name="briefcase-outline"
              ></ion-icon>

            </div>

            <ion-label>
              Administrativo
            </ion-label>

          </ion-item>

        </ion-menu-toggle>


        <!-- AVISOS -->

        <ion-menu-toggle
          auto-hide="false"
        >

          <ion-item
            routerLink="/app/avisos"
            routerDirection="root"
            routerLinkActive="selected"
            detail="false"
          >

            <div
              slot="start"
              class="menu-item-icon"
            >

              <ion-icon
                name="notifications-outline"
              ></ion-icon>

            </div>

            <ion-label>
              Avisos
            </ion-label>

          </ion-item>

        </ion-menu-toggle>


        <!-- PERFIL -->

        <ion-menu-toggle
          auto-hide="false"
        >

          <ion-item
            routerLink="/app/perfil"
            routerDirection="root"
            routerLinkActive="selected"
            detail="false"
          >

            <div
              slot="start"
              class="menu-item-icon"
            >

              <ion-icon
                name="person-outline"
              ></ion-icon>

            </div>

            <ion-label>
              Perfil
            </ion-label>

          </ion-item>

        </ion-menu-toggle>

      </ion-list>


      <!-- ======================= -->
      <!-- PROFESOR                -->

      >

              ></ion-icon>

            </ion-label>

          </ion-item>

        </ion-menu-toggle>


        <!-- ALUMNOS -->

        >

            routerDirection="root"

          >

            <div
              slot="start"

            >

            <ion-label>

            </ion-label>

          </ion-item>

        </ion-menu-toggle>


        <!-- ASISTENCIA -->

        <ion-menu-toggle

        >

          >

            <ion-label>

            </ion-label>

          </ion-item>

        </ion-menu-toggle>


        <!-- CALENDARIO -->

        <ion-menu-toggle
          auto-hide="false"
        >

          <ion-item
            routerLink="/app/calendario"
            routerDirection="root"
            routerLinkActive="selected"
            detail="false"
          >

            <div
              slot="start"
              class="menu-item-icon"
            >

              <ion-icon
                name="calendar-outline"
              ></ion-icon>

            </div>

            <ion-label>
              Calendario
            </ion-label>

          </ion-item>

        </ion-menu-toggle>


        <!-- AVISOS -->

        <ion-menu-toggle
          auto-hide="false"
        >

          <ion-item

            routerDirection="root"
            routerLinkActive="selected"
            detail="false"
          >

            <div
              slot="start"

            >

              <ion-icon
                name="notifications-outline"
              ></ion-icon>

            </div>

            <ion-label>
              Avisos
            </ion-label>

          </ion-item>

        </ion-menu-toggle>


        <!-- PERFIL -->

        <ion-menu-toggle
          auto-hide="false"
        >

          <ion-item
            routerLink="/app/perfil"
            routerDirection="root"
            routerLinkActive="selected"
            detail="false"
          >

            <div
              slot="start"

            >

              <ion-icon
                name="person-outline"
              ></ion-icon>

            </div>

            <ion-label>
              Perfil
            </ion-label>

          </ion-item>

        </ion-menu-toggle>

      </ion-list>


      <!-- ======================= -->
      <!-- RESPONSABLE             -->
      <!-- ======================= -->

      <ion-list
        *ngIf="isResponsible"
        lines="none"
        class="menu-list"
      >


        <!-- INICIO -->

        <ion-menu-toggle
          auto-hide="false"
        >

          <ion-item

            routerDirection="root"

              exact: true
            }"

          >

            <div
              slot="start"
              class="menu-item-icon"
            >

              <ion-icon
                name="home-outline"
              ></ion-icon>

            </div>

            <ion-label>
              Inicio
            </ion-label>

          </ion-item>

        </ion-menu-toggle>


        <!-- CUOTAS -->

        <ion-menu-toggle
          auto-hide="false"
        >

          <ion-item
            routerLink="/app/mis-cuotas"
            routerDirection="root"
            routerLinkActive="selected"
            detail="false"
          >

            <div
              slot="start"
              class="menu-item-icon"
            >

              <ion-icon
                name="card-outline"
              ></ion-icon>

            </div>

            <ion-label>

            </ion-label>

          </ion-item>

        </ion-menu-toggle>


        <!-- AVISOS -->

        <ion-menu-toggle

        >

          <ion-item

            routerDirection="root"

            detail="false"
          >

            <div
              slot="start"
              class="menu-item-icon"
            >

              <ion-icon
                name="notifications-outline"
              ></ion-icon>

            </div>

            <ion-label>
              Avisos
            </ion-label>

          </ion-item>

        </ion-menu-toggle>


        <!-- PERFIL -->

        <ion-menu-toggle
          auto-hide="false"
        >

          <ion-item
            routerLink="/app/perfil"
            routerDirection="root"
            routerLinkActive="selected"
            detail="false"
          >

            <div
              slot="start"
              class="menu-item-icon"
            >

              <ion-icon
                name="person-circle-outline"
              ></ion-icon>

            </div>

            <ion-label>

            </ion-label>

          </ion-item>

        </ion-menu-toggle>

      </ion-list>


    </ion-content>


    <!-- ======================= -->
    <!-- CERRAR SESIÓN           -->
    <!-- ======================= -->

    <ion-footer
      class="ion-no-border menu-footer"
    >

      <ion-toolbar>

        <ion-button
          expand="block"
          fill="clear"
          class="logout-button"
          (click)="logout()"
        >

          <ion-icon
            slot="start"
            name="log-out-outline"
          ></ion-icon>

          Cerrar sesión

        </ion-button>

      </ion-toolbar>

    </ion-footer>


  </ion-menu>


  <ion-router-outlet
    id="main-content"
  ></ion-router-outlet>

</ion-app>
