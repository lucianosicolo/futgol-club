name: Deploy FUTGOL CLUB

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Ionic CLI
        run: npm install -g @ionic/cli

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compilar FUTGOL CLUB
        run: ionic build -- --base-href=/futgol-club/

      - name: Subir archivos compilados
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./www


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4