name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Calendar tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/calendario/calendario.page.spec.ts
